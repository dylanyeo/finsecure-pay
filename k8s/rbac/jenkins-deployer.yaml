# Least-privilege identity for Jenkins. It can deploy the app in the "finsecure"
# namespace only, cannot read Secrets, and has no rights anywhere else in the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-deployer
  namespace: finsecure
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-deployer
  namespace: finsecure
rules:
  - apiGroups: [""]
    resources: ["configmaps", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer
  namespace: finsecure
subjects:
  - kind: ServiceAccount
    name: jenkins-deployer
    namespace: finsecure
roleRef:
  kind: Role
  name: jenkins-deployer
  apiGroup: rbac.authorization.k8s.io
---
# Long-lived token for the Jenkins kubeconfig (stored only in the Jenkins credential store)
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-deployer-token
  namespace: finsecure
  annotations:
    kubernetes.io/service-account.name: jenkins-deployer
type: kubernetes.io/service-account-token

# Public entry point: an AWS Network Load Balancer on port 80 -> container port 8080 (business API only).
apiVersion: v1
kind: Service
metadata:
  name: finsecure-pay
  namespace: finsecure
  labels:
    app.kubernetes.io/name: finsecure-pay
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: finsecure-pay
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Internal-only service for the management port (probes/metrics). Prometheus scrapes this;
# it is never exposed outside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: finsecure-pay-metrics
  namespace: finsecure
  labels:
    app.kubernetes.io/name: finsecure-pay
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: finsecure-pay
  ports:
    - name: management
      port: 8081
      targetPort: management
